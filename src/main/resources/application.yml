spring:
  datasource:
    platform: h2
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      data-locations: classpath:data.sql
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true

  batch:
    job:
      enabled: false